<!DOCTYPE html>
<html>
<head>
  <title>Search Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .search-container {
      width: 500px;
      text-align: center;
    }
    .search-box {
      width: 100%;
      padding: 15px 20px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }
    .search-box:hover, .search-box:focus {
      box-shadow: 0 1px 6px rgba(32,33,36,0.5);
    }
    .submit-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #357ae8;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <!-- REPLACE YOUR_EMAIL@example.com BELOW WITH YOUR ACTUAL EMAIL -->
    <form action="https://formsubmit.co/deepak.e45516@gmail.com" method="POST">
      <input 
        type="text" 
        name="query" 
        class="search-box" 
        placeholder="Search here..." 
        required
      >
      <input type="hidden" name="_subject" value="New Search Query from Website">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://YOUR-USERNAME.github.io">
      <br>
      <button type="submit" class="submit-btn">Search</button>
    </form>
  </div>
</body>
</html>
